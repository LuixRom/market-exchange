# Esta copia reemplaza por completo a src/main/resources/application.properties en el
# classpath de test (Spring Boot NO las combina), así que tiene que llevar TODO lo que
# el arranque necesita, no solo los valores que faltan.
#
# Los valores de abajo son de prueba, no secretos reales. TradeProposalConcurrencyTest
# (@SpringBootTest) carga el contexto completo, incluida la resolución real de
# ${JWT_SECRET}/${DB_USERNAME}/etc. (a propósito sin default en el properties de main,
# para producción). DB_URL/DB_USERNAME/DB_PASSWORD los sobreescribe igual
# @DynamicPropertySource con el contenedor de Testcontainers; están aquí solo para que
# la resolución de placeholders no falle antes de que el contexto arranque.

spring.application.name=proyecto-backend-marketexchange

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5555/postgres}
spring.datasource.username=${DB_USERNAME:test}
spring.datasource.password=${DB_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:test-only-secret-not-real}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
