spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5555/marketexchange}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-for-local-development}

logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.dbp=${APP_LOG_LEVEL:DEBUG}

app.seed.enabled=${SEED_ENABLED:true}
