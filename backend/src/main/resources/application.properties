spring.application.name=proyecto-backend-marketexchange

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

jwt.secret=${JWT_SECRET}
app.auth.email-verification-token-hours=${EMAIL_VERIFICATION_TOKEN_HOURS:24}
app.auth.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.frontend.verify-email-path=${FRONTEND_VERIFY_EMAIL_PATH:/verify-email}

logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.dbp=${APP_LOG_LEVEL:INFO}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.base-directory=${STORAGE_LOCAL_BASE_DIRECTORY:uploads}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:}
app.storage.supabase.connect-timeout=${SUPABASE_CONNECT_TIMEOUT:5s}
app.storage.supabase.read-timeout=${SUPABASE_READ_TIMEOUT:15s}

app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@marketexchange.local}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.admin.firstname=${SEED_ADMIN_FIRSTNAME:Market}
app.seed.admin.lastname=${SEED_ADMIN_LASTNAME:Admin}
app.seed.admin.phone=${SEED_ADMIN_PHONE:999999999}
app.seed.admin.address=${SEED_ADMIN_ADDRESS:Local admin address}
app.seed.user1.email=${SEED_USER1_EMAIL:cliente1@marketexchange.local}
app.seed.user1.password=${SEED_USER1_PASSWORD:}
app.seed.user1.firstname=${SEED_USER1_FIRSTNAME:Cliente}
app.seed.user1.lastname=${SEED_USER1_LASTNAME:Uno}
app.seed.user1.phone=${SEED_USER1_PHONE:900000001}
app.seed.user1.address=${SEED_USER1_ADDRESS:Direccion cliente uno}
app.seed.user2.email=${SEED_USER2_EMAIL:cliente2@marketexchange.local}
app.seed.user2.password=${SEED_USER2_PASSWORD:}
app.seed.user2.firstname=${SEED_USER2_FIRSTNAME:Cliente}
app.seed.user2.lastname=${SEED_USER2_LASTNAME:Dos}
app.seed.user2.phone=${SEED_USER2_PHONE:900000002}
app.seed.user2.address=${SEED_USER2_ADDRESS:Direccion cliente dos}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.info.env.enabled=true
info.app.name=MarketExchange Backend
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}
