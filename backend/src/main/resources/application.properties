spring.application.name=proyecto-backend-marketexchange
# Configuración de la base de datos (todas las credenciales vienen de variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5555/postgres}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}

logging.level.org.springframework=DEBUG
logging.level.com.dbp=DEBUG

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Storage: "local" (por defecto) o "supabase" (todavía no implementado, ver
# SupabaseStorageService). El directorio local vive FUERA de src/main/java a propósito;
# los 11 archivos existentes en la ubicación vieja NO se mueven automáticamente -ver
# backend/migration/V3__storage_shipment_rating_domain.sql para las instrucciones de
# copia manual-.
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.base-directory=${STORAGE_LOCAL_BASE_DIRECTORY:uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}

